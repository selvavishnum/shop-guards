services:
  # ── Backend API (Python FastAPI + YOLOv8 + OpenCV RTSP) ──────────────────────
  - type: web
    name: shopguard-api
    runtime: python
    rootDir: server
    buildCommand: >-
      DEBIAN_FRONTEND=noninteractive apt-get update -qq &&
      apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libsm6 libxext6 libxrender1 &&
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: DB_PATH
        value: shopguard.db

  # ── Frontend (React PWA Static Site) ─────────────────────────────────────────
  - type: web
    name: shopguard-ui
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false       # Set to: https://shopguard-api.onrender.com
