services:
  # ── Backend API (Python FastAPI + YOLOv8 + OpenCV RTSP) ──────────────────────
  - type: web
    name: shopguard-api
    runtime: python
    rootDir: server
    # Render's native Python runtime builds as a non-root user, so apt-get
    # (which needs root) fails every build — this is why every deploy has
    # been failing with "Exited with status 100 while building your code".
    # opencv-python-headless bundles its own FFmpeg support, so no system
    # ffmpeg/libSM/libXext packages are needed at all.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: EZVIZ_APP_KEY
        sync: false
      - key: EZVIZ_APP_SECRET
        sync: false
      - key: EZVIZ_API_BASE
        sync: false       # optional — leave unset to use the default region
      - key: DB_PATH
        value: shopguard.db

  # ── Frontend (React PWA Static Site) ─────────────────────────────────────────
  - type: web
    name: shopguard-ui
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false       # Set to: https://shopguard-api.onrender.com
