# ─────────────────────────────────────────────────────────────────────────────
#  ShopGuard On-Site AI Agent — configuration
#
#  Copy this file to  config.yaml  and fill in your values.
#      cp config.example.yaml config.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Your dashboard URL (the Render site). NO trailing slash.
cloud_url: https://YOUR-APP.onrender.com

# Secret key that links this agent to your dashboard.
# Get it from:  Dashboard → Settings → On-Site Agent → Agent Key
# (or open  https://YOUR-APP.onrender.com/api/agent/status  in a browser)
agent_key: CHANGE_ME

# How often (seconds) to run AI on each camera. Because this runs locally you can
# go much faster than the cloud — 3-5s feels almost live. Lower = more CPU.
scan_interval: 5

# YOLO model:  yolov8n.pt = fastest (good for CPU / Raspberry Pi)
#              yolov8s.pt = more accurate, needs more power
#              yolov8m.pt = best accuracy, needs a GPU
model: yolov8n.pt

# Detection confidence threshold (0.0-1.0). Higher = fewer false positives.
conf: 0.4

# JPEG quality for snapshots sent to the cloud (1-100). Lower = less bandwidth.
jpeg_quality: 70

# How often (seconds) to re-read feature toggles you set in the web dashboard.
config_sync_interval: 30

# ─────────────────────────────────────────────────────────────────────────────
#  Cameras  — these RTSP URLs use your LOCAL IPs and stay inside the shop.
#  features:  theft | vehicle | staff | product   (true/false)
#  monitor_type:  theft | customer_count | cash_drawer | staff_misbehavior | staff_idle
# ─────────────────────────────────────────────────────────────────────────────
cameras:
  # Hikvision DVR — Channel 1 main stream
  - serial: DVR-CAM1
    name: Shop Front
    location: Entrance
    rtsp_url: rtsp://admin:Tu123456@192.168.31.36:554/Streaming/Channels/101
    monitor_type: theft
    features: { theft: true, vehicle: true, staff: false, product: false }
    zones: []

  # Hikvision DVR — Channel 2 main stream
  - serial: DVR-CAM2
    name: Aisle
    location: Inside
    rtsp_url: rtsp://admin:Tu123456@192.168.31.36:554/Streaming/Channels/201
    monitor_type: theft
    features: { theft: true }
    zones: []

  # Ezviz CS-C6N
  - serial: EZVIZ-1
    name: Counter
    location: Cash Counter
    rtsp_url: rtsp://admin:VERIFICATION_CODE@192.168.31.92:554/h264/ch1/main/av_stream
    monitor_type: cash_drawer
    features: { theft: true }
    zones: []

  # Mi / Xiaomi camera
  - serial: MI-1
    name: Back Door
    location: Storage
    rtsp_url: rtsp://admin:Tu123456@192.168.31.72/stream1
    monitor_type: staff_idle
    features: { theft: true, staff: true }
    zones: []
